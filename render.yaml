services:
  - type: web
    name: bloodlink-web
    runtime: docker
    plan: free
    region: omaha
    build:
      dockerfilePath: ./Dockerfile
      # Render runs `docker build` using the Dockerfile; the container's
      # ENTRYPOINT (docker-entrypoint.sh) takes care of port binding,
      # migrations and cache warming.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Provide sensible defaults; override the real values in the Render
      # dashboard.
      - key: APP_NAME
        value: Blood Link
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://bloodlink-web.onrender.com
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: sqlite
      # Pointed at /data (a dedicated mount) rather than /var/www/html/database,
      # because a disk mounted over /var/www/html/database would shadow the
      # migrations directory and break `artisan migrate` at boot.
      - key: DB_DATABASE
        value: /data/database.sqlite
      - key: DB_FOREIGN_KEYS
        value: "true"
      - key: DB_JOURNAL_MODE
        value: WAL
      - key: DB_BUSY_TIMEOUT
        value: "10000"
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
    # SQLite is a file, so the container's filesystem must survive redeploys or
    # every push wipes all data. Render disks are a PAID feature — if you are on
    # `plan: free`, leave this commented out (data then resets on each redeploy)
    # or upgrade and uncomment it.
    #
    # disk:
    #   name: bloodlink-data
    #   mountPath: /data
    #   sizeGB: 1
